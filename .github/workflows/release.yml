name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $appVersion = (Select-String -Path app\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
            # A build that reports an older version than its tag offers itself as an
            # update forever, so refuse to release it.
            if ($tagVersion -ne $appVersion) {
              Write-Error "Tag $tagVersion does not match __version__ $appVersion in app/__init__.py"
              exit 1
            }
          }
          "value=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_basics.py

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Tunetop
          --icon assets/icon.ico
          --add-data "skins;skins"
          --add-data "locales;locales"
          main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\Tunetop.iss

      - name: Checksum installer
        shell: pwsh
        run: |
          # The in-app updater refuses an installer whose SHA-256 doesn't match this file.
          Get-ChildItem dist\TunetopSetup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)" -Encoding ascii -NoNewline
          }

      - name: Package
        run: |
          mkdir release
          copy dist\Tunetop.exe release\
          copy README.md release\
          copy README.ru.md release\
          copy LICENSE release\
          copy CHANGELOG.md release\
          Compress-Archive -Path release\* -DestinationPath Tunetop-v${{ steps.version.outputs.value }}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tunetop-windows
          path: |
            dist/Tunetop.exe
            dist/TunetopSetup-*.exe
            dist/TunetopSetup-*.exe.sha256
            Tunetop-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/Tunetop.exe
            dist/TunetopSetup-*.exe
            dist/TunetopSetup-*.exe.sha256
            Tunetop-*.zip
